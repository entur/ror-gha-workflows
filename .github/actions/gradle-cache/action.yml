name: Gradle Cache
description: Set up Java and Gradle dependency caching with automatic cleanup of ephemeral files
inputs:
  java-version:
    description: "Java version to install"
    required: false
    default: "21"
  java-distribution:
    description: "Java distribution (liberica, temurin, etc.)"
    required: false
    default: "liberica"

runs:
  using: composite
  steps:
    - uses: actions/setup-java@v5
      with:
        distribution: ${{ inputs.java-distribution }}
        java-version: ${{ inputs.java-version }}

    - uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper/dists
        key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle.properties', '**/gradle-wrapper.properties', 'gradle/*.versions.toml') }}
        restore-keys: gradle-

    - name: Cleanup Gradle cache
      if: always()
      shell: bash
      run: |
        rm -f ~/.gradle/caches/journal-1/file-access.bin
        rm -f ~/.gradle/caches/*/gc.properties
        find ~/.gradle/caches -name "*.lock" -delete 2>/dev/null || true
