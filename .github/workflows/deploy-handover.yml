name: RoR/Deploy/Handover

# Deploys an image built in a public app repo (entur/<app>) from its internal
# deployment-config repo, as described in entur/ror-tasks#45. The caller owns
# the triggers, Approve environment, Slack secret and helm/<app> chart:
#
#   on:
#     workflow_dispatch:
#       inputs:
#         run_id: { type: string, required: false }
#         image_tag: { type: string, required: false }
#     push:
#       branches: [main]
#       paths: [".github/workflows/deploy.yml", "helm/**"]
#     pull_request:
#       paths: [".github/workflows/deploy.yml", "helm/**"]
#   jobs:
#     deploy:
#       # What the called workflows ask for (scan, push, deploy).
#       permissions:
#         actions: read
#         contents: write
#         id-token: write
#         issues: write
#         pull-requests: write
#         security-events: write
#       uses: entur/ror-gha-workflows/.github/workflows/deploy-handover.yml@v1
#       with:
#         app: poiman
#         run_id: ${{ inputs.run_id }}
#         image_tag: ${{ inputs.image_tag }}
#       secrets: inherit
#
# handover-image.yml picks the image (run_id, image_tag, or for a helm push
# the image from <app>'s latest build on main) and gets it into GAR; this
# workflow then deploys it. Pull requests only lint the chart.

on:
  workflow_call:
    inputs:
      app:
        description: "Repo, image, chart (helm/<app>), namespace and release name"
        type: string
        required: true
      run_id:
        description: "<app> build run on main whose image to push and deploy"
        type: string
        default: ""
      image_tag:
        description: "Image already in GAR to deploy, e.g. main.20261103-SHAabc1234"
        type: string
        default: ""
      source_workflow:
        description: "Workflow in <app> that builds the image"
        type: string
        default: ".github/workflows/build.yml"
      environments:
        description: "Where to deploy: 'dev' or 'dev,tst,prd'"
        type: string
        default: "dev,tst,prd"
    secrets:
      SLACK_WEBHOOK_URL:
        description: "Incoming webhook for failure alerts (passed with secrets: inherit)"
        required: false

# No workflow-level lock: a run waiting for approval must not block newer
# runs. A newer run reaching an approval cancels an older run waiting at the
# same approval; helm deploys are serialized per env and never cancelled.

jobs:
  helm-lint:
    uses: entur/gha-helm/.github/workflows/lint.yml@080c3d42794f3be06b42e3a81ff23a3a0e3b0235 # v2.1.0
    with:
      environment: dev
      chart: helm/${{ inputs.app }}

  # resolve, fetch, scan and push; see handover-image.yml.
  image:
    if: github.event_name != 'pull_request'
    permissions:
      actions: read
      contents: write
      id-token: write
      issues: write
      pull-requests: write
      security-events: write
    uses: entur/ror-gha-workflows/.github/workflows/handover-image.yml@v1
    with:
      app: ${{ inputs.app }}
      run_id: ${{ inputs.run_id }}
      image_tag: ${{ inputs.image_tag }}
      source_workflow: ${{ inputs.source_workflow }}
    secrets: inherit

  deploy-dev:
    needs: [helm-lint, image]
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    uses: entur/gha-helm/.github/workflows/deploy.yml@080c3d42794f3be06b42e3a81ff23a3a0e3b0235 # v2.1.0
    with:
      environment: dev
      image: ${{ inputs.app }}:${{ needs.image.outputs.tag }}
      chart: helm/${{ inputs.app }}
      namespace: ${{ inputs.app }}
      release_name: ${{ inputs.app }}
    secrets: inherit

  approval-tst:
    concurrency:
      group: approval-tst
      cancel-in-progress: true
    needs: deploy-dev
    if: ${{ !cancelled() && needs.deploy-dev.result == 'success' && contains(inputs.environments, 'tst') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: Approve
    steps:
      - run: echo "Approve TST deployment"

  deploy-tst:
    needs: [image, approval-tst]
    if: ${{ !cancelled() && needs.approval-tst.result == 'success' }}
    concurrency:
      group: deploy-tst
      cancel-in-progress: false
    uses: entur/gha-helm/.github/workflows/deploy.yml@080c3d42794f3be06b42e3a81ff23a3a0e3b0235 # v2.1.0
    with:
      environment: tst
      image: ${{ inputs.app }}:${{ needs.image.outputs.tag }}
      chart: helm/${{ inputs.app }}
      namespace: ${{ inputs.app }}
      release_name: ${{ inputs.app }}
    secrets: inherit

  approval-prd:
    concurrency:
      group: approval-prd
      cancel-in-progress: true
    needs: deploy-tst
    if: ${{ !cancelled() && needs.deploy-tst.result == 'success' && contains(inputs.environments, 'prd') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: Approve
    steps:
      - run: echo "Approve PRD deployment"

  deploy-prd:
    needs: [image, approval-prd]
    if: ${{ !cancelled() && needs.approval-prd.result == 'success' }}
    concurrency:
      group: deploy-prd
      cancel-in-progress: false
    uses: entur/gha-helm/.github/workflows/deploy.yml@080c3d42794f3be06b42e3a81ff23a3a0e3b0235 # v2.1.0
    with:
      environment: prd
      image: ${{ inputs.app }}:${{ needs.image.outputs.tag }}
      chart: helm/${{ inputs.app }}
      namespace: ${{ inputs.app }}
      release_name: ${{ inputs.app }}
    secrets: inherit

  # Direct needs only, so a rejected approval doesn't alert.
  notify-slack:
    needs: [helm-lint, image, deploy-dev, deploy-tst, deploy-prd]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - if: env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "*${{ github.workflow }}* ${{ inputs.app }} ${{ needs.image.outputs.tag || 'main' }} failed: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|run>"
